name: Gradle Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macOS-15, macOS-15-intel]
        java: ['25']
        distribution: ['temurin']
        gradle: ['9.2.1']
      fail-fast: false
    env:
      # Use env variable to specify the JDK version to use for the `testMinJdk` Gradle option
      MIN_JDK: ${{ matrix.os == 'macOS-15' && '11' || '11' }}
    name: ${{ matrix.os }} JDK ${{ matrix.java }}.${{ matrix.distribution }} Gradle ${{ matrix.gradle }}
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.distribution }}
          java-version: |
            ${{ env.MIN_JDK }}
            ${{ matrix.java }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Run Gradle
        run: gradle -PtestMinJdk=${{ env.MIN_JDK }} build installDist jlink --init-script build-scan-agree.gradle --scan --info --stacktrace
      - name: Upload Test Results and Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bitcoinj-core-test-results-jdk${{ matrix.java }}-${{ matrix.os }}-${{ matrix.gradle }}
          path: |
            base/build/reports/tests/test/
            base/build/test-results/test/
            core/build/reports/tests/test/
            core/build/test-results/test/
            wallettool/build/reports/tests/test/
            wallettool/build/test-results/test/
            integration-test/build/reports/tests/test/
            integration-test/build/test-results/test/

  build_graalvm:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macOS-15]
        java: [ '25' ]
        distribution: [ 'graalvm-community' ]
        gradle: ['9.2.1']
      fail-fast: false
    name: ${{ matrix.os }} JDK ${{ matrix.java }}.${{ matrix.distribution }}
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
      - name: Set up GraalVM
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Run Gradle
        run: gradle test nativeCompile --init-script build-scan-agree.gradle --scan --info --stacktrace
      - name: Upload wallet-tool as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wallet-tool-${{ matrix.os }}-${{ matrix.java }}-gradle-${{ matrix.gradle }}
          path: wallettool/build/native/nativeCompile/wallet-tool

  build_all_green:
    runs-on: ubuntu-24.04
    needs: [build, build_graalvm]
    steps:
      - run: echo "All upstream jobs passed"
