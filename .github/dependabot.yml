# To see the documentation for all Dependabot configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/" # Location of package manifests
    open-pull-requests-limit: 10
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "nl.jqno.equalsverifier:equalsverifier"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.fasterxml.jackson.core:jackson-*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "org.asciidoctor.jvm.convert"
        update-types: ["version-update:semver-major"]
    # Group multi-artifact families that share a version so each bump is one PR.
    groups:
      junit:
        patterns:
          - "org.junit:*"
